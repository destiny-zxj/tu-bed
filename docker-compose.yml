version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: tubed-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tubed
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend
    container_name: tubed-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/tubed
      SECRET_KEY: please-change-this-to-a-long-random-string
      PUBLIC_BASE_URL: /uploads
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: tubed-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  uploads_data:

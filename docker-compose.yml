version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: tubed-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tubed
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend
    container_name: tubed-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/tubed
      SECRET_KEY: please-change-this-to-a-long-random-string
      # 存储驱动: local (本地磁盘) / qiniu (七牛云对象存储) / s3 (S3 兼容对象存储), 默认 local
      DRIVE: local
      PUBLIC_BASE_URL: /uploads
      # 七牛云对象存储 (DRIVE=qiniu 时生效)
      QINIU_ACCESS_KEY:
      QINIU_SECRET_KEY:
      QINIU_BUCKET:
      QINIU_DOMAIN:
      # S3 兼容对象存储 (DRIVE=s3 时生效)
      S3_ENDPOINT_URL:
      S3_REGION_NAME:
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
      S3_BUCKET:
      S3_PUBLIC_DOMAIN:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: tubed-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  uploads_data:

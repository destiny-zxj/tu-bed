[project]
name = "tu-bed-backend"
version = "1.0.0"
description = "TuBed image hosting backend (FastAPI + SQLModel)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "pillow>=10.0.0",
    "qiniu>=7.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]

[tool.uv]
package = false
